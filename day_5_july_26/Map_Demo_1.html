<script>
    let userMap = new Map();
    console.log(userMap);

    // add/update items to map
    userMap.set('name', 'Sanjay'); // Add
    userMap.set('age', 50); // Add
    userMap.set('address', 'Bangalore'); // Add
    userMap.set('role', 'Admin'); // Add
    console.log(userMap);
    userMap.set('role', 'Trainer'); // Update
    console.log(userMap);

    // Check Map Size
    console.log('Size: ', userMap.size);

    // Print the Map
    console.log(userMap);

    // Read 1 value
    console.log('Name: ', userMap.get('name')); // Sanjay

    // Iterate Map
    for (const [key, value] of userMap) {
        console.log(`${key} ==== ${value}`);
    }

    // Remove an Entry
    userMap.delete('age');

    // Remove all entries
    userMap.clear();
</script>
