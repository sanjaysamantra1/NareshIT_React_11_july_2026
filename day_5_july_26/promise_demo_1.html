<script>
    let max_value = Math.max(10, 20, 30, 40); // max() returns a value
    console.log(`max_value: ${max_value}`)

    let userPromise = fetch('https://jsonplaceholder.typicode.com/users'); //fetch() returns a promise
    console.log(userPromise);

    // Read Data From Promise using then()
    userPromise.then(
        (response) => {
            console.log(response);
            response.json().then(finalResponse => {
                console.log(finalResponse)
            })
        },
        (error) => {
            console.log(error)
        }
    )

    
    
</script>
