<script>
    let employees = [
        { eId: 101, name: 'sanjay', sal: 5000, gender: 'male' },
        { eId: 104, name: 'geeta', sal: 8000, gender: 'female' },
        { eId: 103, name: 'sameer', sal: 7000, gender: 'male' },
        { eId: 102, name: 'sita', sal: 9000, gender: 'female' },
        { eId: 105, name: 'deepak', sal: 8000, gender: 'male' }
    ];

    // 1. declare array of employees & sort them in ascending order(empId)
    let result1 = employees.toSorted((emp1, emp2) => emp1.eId - emp2.eId);
    console.log('Employees in sorted Order:', result1);

    // 2. declare array of employees & sort them in ascending order by name.
    let result2 = employees.toSorted((emp1, emp2) => emp1.name.localeCompare(emp2.name));
    console.log('Employees in sorted Order:', result2);

    // 3. declare array of employees & filter the employees whose sal>6000;
    let result3 = employees.filter(emp => emp.sal > 6000)
    console.log('filtered Employeess: ', result3)

    // 4. declare array of employees & increase sal of every employee by 500;
    let result4 = employees.map((emp) => {
        return { ...emp, sal: emp.sal + 500 }
    })
    console.log('Employees with salary increased: ', result4)

    // 5. declare array of employees & increase sal of every employee 10%
    let result5 = employees.map((emp) => {
        return { ...emp, sal: emp.sal + (emp.sal * 0.1) }
    })
    console.log('Employees with salary increased: ', result5)

    // 6. declare array of employees & add "comp:ibm" to every employee;
    let result6 = employees.map((emp) => {
        return { ...emp, comp: 'IBM' }
    })
    console.log('Employees with company: ', result6)
</script>
