<script>
    function add(a, b) {
        console.log(`Addition is: ${a + b}`)
    }
    add(10, 20);
    add(10, 20, 30); // here 3rd param is ignored
    add(10, 20, 30, 40); // here 3rd, 4th params are ignored

    // Write a function that can add any # of params
    function sum(...arr) {  // arr is REST param
        let sum = 0;
        for (ele of arr) {
            sum = sum + ele;
        }
        console.log(`Sum is: ${sum}`);
    }
    sum(10, 20);
    sum(10, 20, 30);
    sum(10, 20, 30, 40);
</script>
