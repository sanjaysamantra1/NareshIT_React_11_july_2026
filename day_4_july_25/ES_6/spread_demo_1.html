<script>
    console.log(Math.max(10, 20, 30, 40, 50));  // 50

    let arr = [10, 20, 30, 40, 50]
    console.log(Math.max(arr)); // NaN, max() is not expecting array as arguement

    // Spread - spread/split array into individual elements
    console.log(Math.max(...arr)); 


    // when ... is used as param inside a function, REST Param
    // ... everywhere else , spread
</script>
