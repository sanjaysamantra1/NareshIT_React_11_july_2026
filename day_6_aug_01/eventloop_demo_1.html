<script>
    // callstack + eventloop + queue(micro,macro)
    console.log('Global code starts here...')

    function f1() {
        console.log('This is f1...')
    }
    function f2() {
        console.log('This is f2...')
    }
    function f3() {
        console.log('This is f3...')
    }
    function f4() {
        console.log('This is f4...')
    }

    f1();
    setTimeout(f2, 0);
    Promise.resolve().then(f3);
    f4();

    console.log('Global code ends here...')
</script>
